upstream orchestrator {
    server orchestrator:8000;
}

server {
    listen 80;
    server_name _;

    # API routes → Orchestrator
    location /api/ {
        proxy_pass http://orchestrator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket for HITL & events
    location /ws {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # noVNC streams — dynamic proxy by container
    location ~ ^/vnc/(?<container_id>[^/]+)/ {
        # Orchestrator resolves container_id → port via internal API
        # For now, static mapping; will be dynamic later
        proxy_pass http://host.docker.internal:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
